name: Feature request
description: Propose a focused improvement to ThothScript
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ThothScript favors small, understandable, local-first features. Describe the problem before the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should ThothScript do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention simpler workarounds or designs you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Explorer / workspace
        - Search / replace
        - Markdown
        - Recovery / sessions
        - Printing / PDF
        - Packaging / release
        - Accessibility / UX
        - Developer tooling
        - Other
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: This can preserve local-first behavior and the renderer/main-process security boundary.
          required: true
