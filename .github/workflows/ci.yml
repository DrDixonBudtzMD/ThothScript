name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax checks
        run: npm run check

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(p.version!=='0.3.1'||!p.devDependencies.electron||!p.devDependencies['@electron/packager']) process.exit(1)"
