name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Project diagnostics
        run: npm run doctor

      - name: Syntax checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(p.version!=='0.3.1'||!p.devDependencies.electron||!p.devDependencies['@electron/packager']) process.exit(1)"
