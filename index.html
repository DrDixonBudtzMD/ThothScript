<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ThothScript</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <div class="mark" title="ThothScript">𓁟</div>
      <button class="railbtn active" id="railExplorer" title="Explorer">
        <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z" /></svg>
      </button>
      <button class="railbtn" id="railSearch" title="Search">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="5"/><path d="M14 14l6 6"/></svg>
      </button>
      <button class="railbtn" id="railDocs" title="Documents">
        <svg viewBox="0 0 24 24"><path d="M7 3h7l3 3v15H7z"/><path d="M9 11h6M9 15h6"/></svg>
      </button>
      <button class="railbtn" id="railCommand" title="Command Palette">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <div class="railspacer"></div>
      <button class="railbtn" id="railFocus" title="Focus Mode">
        <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
      <button class="railbtn" id="railInfo" title="Info">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg>
      </button>
    </aside>

    <aside class="sidebar" id="sidebar">
      <div class="sidehead">
        <div class="sidetitle" id="sideTitle">Explorer</div>
        <button class="smallbtn" id="btnOpenFolder">Open Folder</button>
      </div>

      <div id="explorerPanel" class="panel">
        <div class="sectionTitle">Workspace</div>
        <div id="tree" class="tree">
          <div class="empty">Open a folder to browse files.</div>
        </div>
        <div class="sectionTitle">Recent Files</div>
        <div id="recentFiles" class="recentFiles">
          <div class="empty">No recent files yet.</div>
        </div>
      </div>

      <div id="searchPanel" class="panel" style="display:none;">
        <div class="searchbox">
          <input id="searchInput" placeholder="Find in workspace..." />
          <input id="replaceInput" placeholder="Replace with..." />
          <div class="checkrow">
            <label><input type="checkbox" id="searchCase"> Case</label>
            <label><input type="checkbox" id="searchRegex"> Regex</label>
            <label><input type="checkbox" id="searchWhole"> Whole</label>
          </div>
          <button id="btnRunSearch">Search</button>
          <button id="btnRunReplace">Replace All</button>
        </div>
        <div id="searchResults" class="searchResults">
          <div class="empty">Open a folder, then search.</div>
        </div>
      </div>
    </aside>

    <div id="resizer" class="resizer" title="Drag to resize explorer"></div>

    <main class="workspace" id="workspace">
      <button id="focusEscape" class="focusEscape" title="Exit Focus Mode">Esc / F11 — Exit Focus</button>
      <header class="topbar">
        <div class="brandblock">
          <div class="title">ThothScript</div>
          <div class="subtitle">Code editor + plain text workspace</div>
        </div>

        <div class="iconbar">
          <button class="iconbtn" id="btnNewText" title="New Plain Text">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="iconbtn" id="btnNewCode" title="New Code File">
            <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>
          </button>
          <button class="iconbtn" id="btnNewMarkdown" title="New Markdown">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M7 15V9l3 4 3-4v6M16 9v6"/></svg>
          </button>
          <button class="iconbtn" id="btnOpenFile" title="Open File">
            <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/><path d="M12 10v7m0 0l-3-3m3 3l3-3"/></svg>
          </button>
          <button class="iconbtn" id="btnSave" title="Save">
            <svg viewBox="0 0 24 24"><path d="M5 20h14V8l-3-3H5z"/><path d="M8 20v-7h8v7M8 5v5h7"/></svg>
          </button>
          <button class="iconbtn" id="btnSaveAs" title="Save As">
            <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 17l10-10 2 2-10 10H7z"/></svg>
          </button>
          <span class="sep"></span>
          <button class="iconbtn" id="btnMarkdownPreview" title="Markdown Preview">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 15V9l3 4 3-4v6M16 12h2"/></svg>
          </button>
          <button class="iconbtn" id="btnExportPdf" title="Export PDF">
            <svg viewBox="0 0 24 24"><path d="M7 3h7l3 3v15H7z"/><path d="M14 3v4h4"/><path d="M9 14h6M9 17h4"/></svg>
          </button>
          <button class="iconbtn" id="btnPrint" title="Print">
            <svg viewBox="0 0 24 24"><path d="M7 8V4h10v4"/><path d="M7 17v3h10v-3"/><path d="M6 10h12v7H4v-5a2 2 0 0 1 2-2z"/></svg>
          </button>
          <span class="sep"></span>
          <button class="iconbtn primary" id="btnToggleMode" title="Toggle Plain/Code">
            <svg viewBox="0 0 24 24"><path d="M8 8h8M8 12h5M8 16h8"/><path d="M16 12l2 2 2-2"/></svg>
          </button>
          <button class="iconbtn" id="btnCommand" title="Command Palette">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
          </button>
          <button class="iconbtn" id="btnFocus" title="Focus Mode">
            <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          </button>
        </div>

        <div class="statusbox">
          <div id="hint">Ready</div>
          <div id="status">Bridge checking...</div>
        </div>
      </header>

      <section class="tabs" id="tabs"></section>

      <section class="editorShell" id="editorShell">
        <div id="lineNums" class="lineNums">1</div>
        <div class="editorwrap">
          <textarea id="textEditor" class="editor plain" spellcheck="true"></textarea>
          <textarea id="codeEditor" class="editor code" spellcheck="false" style="display:none;"></textarea>
          <textarea id="hexEditor" class="editor code" spellcheck="false" style="display:none;"></textarea>
        </div>
        <div id="markdownPreview" class="markdownPreview" style="display:none;"></div>
      </section>

      <footer class="statusbar">
        <span id="fileInfo">No file</span>
        <span id="cursorInfo">Ln 1, Col 1</span>
        <span id="modeInfo">Plain Text</span>
        <span id="wordInfo">Words: 0 | Chars: 0</span>
      </footer>
    </main>
  </div>

  <div id="commandOverlay" class="commandOverlay" style="display:none;">
    <div class="commandBox">
      <input id="commandInput" placeholder="Type a command..." />
      <div id="commandList" class="commandList"></div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
